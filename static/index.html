<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph + RAGFlow 测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 600px;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #e9ecef;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ced4da;
            border-radius: 3px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .message.user .message-meta {
            text-align: right;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e9ecef;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-row input:focus {
            border-color: #667eea;
        }

        .input-row button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .input-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .context-info {
            font-size: 11px;
            color: #667eea;
            margin-top: 6px;
            font-weight: 500;
        }

        .file-references {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .file-references-title {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #495057;
            margin-bottom: 3px;
        }

        .file-item:last-child {
            margin-bottom: 0;
        }

        .file-icon {
            font-size: 12px;
        }

        .file-path {
            color: #6c757d;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            font-size: 12px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
            margin-right: 6px;
        }

        .status-dot.offline {
            background: #dc3545;
        }

        .new-chat-btn {
            padding: 4px 12px;
            background: #e9ecef;
            color: #495057;
            border: none;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #dee2e6;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 90vh;
            }

            .message-bubble {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>LangGraph + RAGFlow 测试平台</h1>
            <p>基于 LangGraph 构建的 RAG 问答系统</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message assistant">
                <div class="message-bubble">
                    你好！我是基于 RAGFlow 知识库的问答助手。请输入你的问题，我会帮你检索相关文档并给出回答。
                </div>
                <div class="message-meta">助手</div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-row">
                <input type="text" id="question" placeholder="请输入你的问题..." autocomplete="off">
                <button id="send-btn">发送</button>
            </div>
        </div>

        <div class="status-bar">
            <span><span class="status-dot" id="status-dot"></span>服务状态</span>
            <div style="display: flex; gap: 12px;">
                <span id="response-time">响应时间: -- ms</span>
                <button class="new-chat-btn" id="new-chat-btn">新对话</button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const questionInput = document.getElementById('question');
        const sendBtn = document.getElementById('send-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const statusDot = document.getElementById('status-dot');
        const responseTime = document.getElementById('response-time');

        let isLoading = false;
        let conversationId = null;
        let datasetId = null;

        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                statusDot.classList.toggle('offline', !data.ragflow_connected);
            } catch {
                statusDot.classList.add('offline');
            }
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = text;

            const metaDiv = document.createElement('div');
            metaDiv.className = 'message-meta';
            metaDiv.textContent = type === 'user' ? '你' : '助手';

            messageDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(metaDiv);

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addContextInfo(count) {
            const lastMessage = messagesContainer.lastElementChild;
            if (lastMessage && lastMessage.classList.contains('assistant')) {
                const infoDiv = document.createElement('div');
                infoDiv.className = 'context-info';
                infoDiv.textContent = `📚 检索到 ${count} 条相关文档`;
                lastMessage.appendChild(infoDiv);
            }
        }

        function addFileReferences(references) {
            const lastMessage = messagesContainer.lastElementChild;
            if (lastMessage && lastMessage.classList.contains('assistant') && references && references.length > 0) {
                const referencesDiv = document.createElement('div');
                referencesDiv.className = 'file-references';

                const sources = [];
                const check = {};
                references.forEach(ref => {
                    if (!check[ref.document_id]) {
                        check[ref.document_id] = true;
                        sources.push(ref);
                    }
                })

                addContextInfo(sources.length);
                const titleDiv = document.createElement('div');
                titleDiv.className = 'file-references-title';
                titleDiv.textContent = `📁 关联文件 (${sources.length})`;
                referencesDiv.appendChild(titleDiv);

                sources.forEach(ref => {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-item';

                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'file-icon';
                    iconSpan.textContent = '📄';

                    const docNameSpan = document.createElement('span');
                    docNameSpan.textContent = ref.document_name;

                    const pathDiv = document.createElement('div');
                    const datasetId = ref.dataset_id;
                    const fileName = ref.document_name;
                    pathDiv.className = 'file-path';
                    pathDiv.textContent = `file/${datasetId}/${fileName}`;

                    fileDiv.appendChild(iconSpan);
                    fileDiv.appendChild(docNameSpan);
                    fileDiv.appendChild(pathDiv);

                    referencesDiv.appendChild(fileDiv);
                });

                lastMessage.appendChild(referencesDiv);
            }
        }

        function showLoading() {
            isLoading = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></span>';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-message';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = '<span class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></span> 正在检索并生成回答...';

            loadingDiv.appendChild(bubbleDiv);
            messagesContainer.appendChild(loadingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideLoading() {
            isLoading = false;
            sendBtn.disabled = false;
            sendBtn.textContent = '发送';

            const loadingMessage = document.getElementById('loading-message');
            if (loadingMessage) {
                loadingMessage.remove();
            }
        }

        function startNewChat() {
            conversationId = null;
            messagesContainer.innerHTML = `
                <div class="message assistant">
                    <div class="message-bubble">
                        你好！我是基于 RAGFlow 知识库的问答助手。请输入你的问题，我会帮你检索相关文档并给出回答。
                    </div>
                    <div class="message-meta">助手</div>
                </div>
            `;
            responseTime.textContent = '响应时间: -- ms';
        }

        async function sendMessage() {
            const question = questionInput.value.trim();
            if (!question || isLoading) return;

            addMessage(question, 'user');
            questionInput.value = '';
            showLoading();

            const startTime = Date.now();

            try {
                const payload = {
                    question: question,
                    conversation_id: conversationId
                };

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '请求失败');
                }

                const data = await response.json();
                const endTime = Date.now();

                if (!conversationId && data.conversation_id) {
                    conversationId = data.conversation_id;
                }

                hideLoading();
                addMessage(data.answer, 'assistant');
                addFileReferences(data.sources);
                responseTime.textContent = `响应时间: ${endTime - startTime} ms`;
            } catch (error) {
                hideLoading();
                addMessage(`错误: ${error.message}`, 'assistant');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        newChatBtn.addEventListener('click', startNewChat);

        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>

</html>
